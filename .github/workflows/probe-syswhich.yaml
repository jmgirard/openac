# TEMPORARY (M09, second probe). The first probe created `tool` AND `tool.exe`
# together, so it never measured what an ABSOLUTE extensionless path resolves to
# when only a sibling carrying an extension exists -- the case the harness's
# predicate claims resolves. Measures that, and which extensions count as
# siblings. Deleted before this milestone's review.
on:
  push:
    branches: [m09-harness-hardening]

name: probe-syswhich.yaml

permissions: read-all

jobs:
  probe:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    name: probe (${{ matrix.os }})
    steps:
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: probe Sys.which sibling resolution
        shell: Rscript {0}
        run: |
          say <- function(label, value) {
            cat(sprintf("%-52s -> %s\n", label,
                        if (nzchar(value)) value else "<empty>"))
          }
          cat("## R", as.character(getRversion()), "on", Sys.info()[["sysname"]],
              "| .Platform$OS.type =", .Platform$OS.type, "\n")

          # Each case gets its OWN directory holding exactly one file, so no
          # other sibling can answer the question by accident -- the flaw in
          # the first probe.
          one <- function(ext, mode = "0755") {
            dir <- tempfile("probe"); dir.create(dir)
            p <- file.path(dir, paste0("tool", ext))
            file.create(p); Sys.chmod(p, mode)
            file.path(dir, "tool")   # ALWAYS ask for the extensionless name
          }

          cat("\n## absolute extensionless path, only a sibling present\n")
          for (e in c(".exe", ".bat", ".cmd", ".com", ".txt")) {
            say(paste0("only 'tool", e, "' exists, asked for 'tool'"),
                Sys.which(one(e)))
          }
          say("only 'tool' exists (no sibling), asked for 'tool'",
              Sys.which(one("")))
          say("only 'tool.exe' at 0644, asked for 'tool'",
              Sys.which(one(".exe", "0644")))

          cat("\n## and asked for the sibling by its own name, for contrast\n")
          d <- tempfile("probe"); dir.create(d)
          p <- file.path(d, "tool.exe"); file.create(p); Sys.chmod(p, "0755")
          say("only 'tool.exe' exists, asked for 'tool.exe'", Sys.which(p))
          say("file.access('tool.exe', 1L)", as.character(file.access(p, 1L)))

          cat("\n## a directory named like a tool\n")
          d2 <- tempfile("probe"); dir.create(file.path(d2, "tool.exe"),
                                              recursive = TRUE)
          say("'tool.exe' is a DIRECTORY, asked for it",
              Sys.which(file.path(d2, "tool.exe")))
