# TEMPORARY (M09). Runs the real check on every platform for THIS branch,
# because R-CMD-check.yaml triggers on pull_request and push-to-main only, and
# M09 rewrites the test harness's platform behavior -- which cannot be trusted
# from a macOS run alone (M08 went red on Windows for exactly this reason).
# Its earlier revision measured what `Sys.which()` resolves on each platform;
# those measurements are recorded on `fake_is_executable()`. Deleted before
# this milestone's review, when the PR makes R-CMD-check.yaml run anyway.
on:
  push:
    branches: [m09-harness-hardening]

name: probe-syswhich.yaml

permissions: read-all

jobs:
  branch-check:
    runs-on: ${{ matrix.config.os }}
    name: branch-check ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::withr
            any::knitr
            any::rmarkdown
            any::spelling
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
