# THROWAWAY. This workflow exists only to measure, against the real
# `gh-pages` branch, how far each deploy lane of `pkgdown.yaml` cleans. It is
# deleted again before the branch merges, together with the preview folder it
# writes on `gh-pages`. Nothing here is part of the package or the site.
#
# The two deploy steps below are verbatim copies of `pkgdown.yaml`'s, except
# for `target-folder`, which points under `m021-preview/` instead of at the
# real `dev/` and the real site root. The lane step is a verbatim copy.
#
# `workflow_dispatch` is not usable here: GitHub refuses to dispatch a
# workflow that is not on the default branch, and this file is deliberately
# never put there. Measured on 2026-10-06, `gh workflow run
# pkgdown-preview.yaml --ref m021-pkgdown-site-lifecycle` answered "HTTP 404:
# workflow pkgdown-preview.yaml not found on the default branch". So the
# trigger is a push of this branch, narrowed to this file alone, which makes
# a run happen only when this file itself changes. No other push of the
# branch can fire one, and the deletion push in T7 cannot either, because the
# file is gone at that ref.
#
# `PKGDOWN_DEV_MODE` below is a literal. The first run lands it as `auto`,
# which builds a tree with `docs/dev`; editing it to `release` and pushing
# again builds a tree without one. The copied lane step then decides each
# run's lane from the tree it was given, the same way the shipped step does.
on:
  push:
    branches: [m021-pkgdown-site-lifecycle]
    paths: ['.github/workflows/pkgdown-preview.yaml']

name: pkgdown-preview.yaml

permissions: read-all

jobs:
  pkgdown-preview:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-preview
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgdown
            any::knitr
            any::rmarkdown
            local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
        env:
          PKGDOWN_DEV_MODE: auto

      - name: Pick the deploy lane
        id: lane
        run: |
          if [ -d docs/dev ]; then
            echo "lane=dev" >> "$GITHUB_OUTPUT"
          else
            echo "lane=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy development docs 🚀
        if: github.event_name != 'pull_request' && steps.lane.outputs.lane == 'dev'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: true
          branch: gh-pages
          folder: docs/dev
          target-folder: m021-preview/dev

      - name: Deploy release docs 🚀
        if: github.event_name != 'pull_request' && steps.lane.outputs.lane == 'release'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: true
          clean-exclude: dev
          branch: gh-pages
          folder: docs
          target-folder: m021-preview/release
