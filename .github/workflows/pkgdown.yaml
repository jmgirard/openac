# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # `audio.whisper` is a Suggest reachable only through DESCRIPTION's
      # `Remotes:` field, and installing it compiles whisper.cpp from source on
      # every runner. The site build never reaches it — the vignettes knit with
      # `eval = FALSE` and no reference example runs a tool — so this installs
      # hard dependencies plus the named docs extras and nothing else. The
      # assert below is what proves it, and it must stay AFTER this step: run
      # before the install it is checking, it would pass on a bare runner and
      # say nothing (M20).
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgdown
            any::knitr
            any::rmarkdown
            local::.
          needs: website

      - name: Confirm audio.whisper is absent
        run: |
          stopifnot(!requireNamespace("audio.whisper", quietly = TRUE))
          cat("audio.whisper absent, as intended\n")
          print(rownames(installed.packages()))
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # The lane comes from the built tree, never from the event. With
      # `development: mode: auto` in `_pkgdown.yml`, a development version
      # builds into `docs/dev` and a release version into the `docs/` root,
      # so the presence of `docs/dev` is what says which site was just built.
      - name: Pick the deploy lane
        id: lane
        run: |
          if [ -d docs/dev ]; then
            echo "lane=dev" >> "$GITHUB_OUTPUT"
          else
            echo "lane=release" >> "$GITHUB_OUTPUT"
          fi

      # Both lanes clean within their own target. The development lane owns
      # `dev/`, so a page removed from the package stops being served there.
      - name: Deploy development docs 🚀
        if: github.event_name != 'pull_request' && steps.lane.outputs.lane == 'dev'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: true
          branch: gh-pages
          folder: docs/dev
          target-folder: dev

      # The release lane owns the root, and keeps `dev/` out of its cleaning
      # so a release deploy does not take the development site with it. A
      # dispatched measurement of this step against a throwaway target showed
      # `clean-exclude: dev` spares a `dev` path at ANY depth under the target,
      # not only the target's own `dev` child, so a future site page whose
      # path contains a `dev` segment would also escape cleaning. No such page
      # exists today.
      - name: Deploy release docs 🚀
        if: github.event_name != 'pull_request' && steps.lane.outputs.lane == 'release'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: true
          clean-exclude: dev
          branch: gh-pages
          folder: docs
