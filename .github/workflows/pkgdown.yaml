# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # `audio.whisper` is a Suggest reachable only through DESCRIPTION's
      # `Remotes:` field, and installing it compiles whisper.cpp from source on
      # every runner. The site build never reaches it — the vignettes knit with
      # `eval = FALSE` and no reference example runs a tool — so this installs
      # hard dependencies plus the named docs extras and nothing else. The
      # assert below is what proves it, and it must stay AFTER this step: run
      # before the install it is checking, it would pass on a bare runner and
      # say nothing (M20).
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgdown
            any::knitr
            any::rmarkdown
            local::.
          needs: website

      - name: Confirm audio.whisper is absent
        run: |
          stopifnot(!requireNamespace("audio.whisper", quietly = TRUE))
          cat("audio.whisper absent, as intended\n")
          print(rownames(installed.packages()))
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
